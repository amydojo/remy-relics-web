name: Object Physics Spike

on:
  push:
    branches:
      - spike/object-physics-v1-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Chromium regression
        run: npm run test:e2e -- --project=mobile-390

      - name: Playwright WebKit focused proof
        run: npx playwright test tests/e2e/object-physics.spec.ts tests/e2e/object-physics-closeout.spec.ts --project=webkit-390

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-physics-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
