name: Import Remy Canon Vectors Pass 2

on:
  push:
    branches:
      - feat/frame-mutation-lab
    paths:
      - .github/workflows/import-remy-canon-vectors-pass2.yml

permissions:
  contents: write

jobs:
  import-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frame-mutation-lab
          fetch-depth: 0

      - name: Download Base and Lab canonical Figma SVG exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/remy-canon
          curl --fail --location --retry 3 -o public/assets/remy-canon/remy-base.svg 'https://www.figma.com/api/mcp/asset/94cf7fb5-4e11-4105-833e-57bbc5e215d6.svg'
          curl --fail --location --retry 3 -o public/assets/remy-canon/remy-lab.svg 'https://www.figma.com/api/mcp/asset/2968375c-efc7-4601-8255-fb1d17153402.svg'

      - name: Verify export contracts and extend provenance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const specs = {
            base: {
              file: 'public/assets/remy-canon/remy-base.svg',
              nodeId: '1008:176',
              bytes: 32414,
              svgStringFingerprint: '26477ee5',
            },
            lab: {
              file: 'public/assets/remy-canon/remy-lab.svg',
              nodeId: '1013:233',
              bytes: 40658,
              svgStringFingerprint: '61da56e9',
            },
          };
          const manifestPath = 'public/assets/remy-canon/source-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.exportedAt = new Date().toISOString();
          manifest.assets ||= {};
          for (const [key, spec] of Object.entries(specs)) {
            const bytes = fs.readFileSync(spec.file);
            const svg = bytes.toString('utf8');
            if (!svg.startsWith('<svg')) throw new Error(`${key}: not an SVG export`);
            if (bytes.length !== spec.bytes) throw new Error(`${key}: bytes ${bytes.length} != ${spec.bytes}`);
            if (!/width="160"/.test(svg) || !/height="160"/.test(svg) || !/viewBox="0 0 160 160"/.test(svg)) {
              throw new Error(`${key}: 160x160 canonical SVG contract missing`);
            }
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            manifest.assets[key] = {
              nodeId: spec.nodeId,
              publicPath: `/${spec.file.replace(/^public\//, '')}`,
              bytes: bytes.length,
              sha256,
              svgStringFingerprint: spec.svgStringFingerprint,
            };
            console.log(`${key}: ${bytes.length} bytes / sha256 ${sha256}`);
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Commit canonical SVG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/remy-canon/remy-base.svg public/assets/remy-canon/remy-lab.svg public/assets/remy-canon/source-manifest.json
          if git diff --cached --quiet; then
            echo 'Base and Lab canonical SVG assets already match.'
            exit 0
          fi
          git commit -m 'feat: add Base and Lab canon vectors'
          git push origin HEAD:feat/frame-mutation-lab
