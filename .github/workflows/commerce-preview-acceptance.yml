name: Commerce Preview Acceptance

on:
  push:
    branches:
      - feat/commerce-v1-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pass-07:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static and unit gates
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Browser E2E
        run: npm run test:e2e

      - name: Generate intentional V1.2 visual baseline
        run: npm run test:visual:update

      - name: Visual regression
        run: npm run test:visual

      - name: Commit approved Linux visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ':(glob)tests/visual/**/*-linux.png'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: commit approved V1.2 Linux visual baselines"
          git push origin HEAD:feat/commerce-v1-2

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-visual-baseline-linux
          path: |
            tests/visual/**/*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7
