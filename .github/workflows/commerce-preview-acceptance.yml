name: Commerce Preview Acceptance

on:
  push:
    branches:
      - feat/commerce-v1-2
      - fix/v1-2-1-product-page-canon
      - fix/v1-2-2-site-shell-navigation
      - fix/v1-2-3-ux-cohesion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass-07:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static and unit gates
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Browser E2E
        run: npm run test:e2e

      - name: Visual regression
        run: npm run test:visual

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-visual-baseline-linux
          path: |
            tests/visual/**/*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7
